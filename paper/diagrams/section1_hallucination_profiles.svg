<svg width="100%" viewBox="0 0 680 330" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title>Section 1.4.4: what each paradigm hallucinates, and where it is caught</title>
<desc>The imperative arm and the SDP arm hallucinate different things. The imperative agent's dominant hallucination is inventing nonexistent I/O paths, which nothing structural can catch, so it surfaces only at runtime (96% of its error iterations) and drives fail-loops and wasted compute. The SDP agent's hallucinations are imperative habits written into a declarative pipeline (spark.conf.set, eager actions in a query function) plus invented undeclared tables and columns; 39% are caught at the cheap dry-run gate before compute. Neither arm hallucinated Databricks DLT.</desc>
<style>
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .kick{font-size:11px;font-weight:700;letter-spacing:.07em;fill:#5d6b66}
  .h{font-size:13px;font-weight:600;fill:#26312e}
  .row{font-size:11.5px;fill:#36423e}
  .cnt{font-size:12.5px;font-weight:800}
  .t{font-size:11px;fill:#5d6b66}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}
  .am rect{fill:#f7efdd;stroke:#8a5a0b;stroke-width:1}.am .h{fill:#6b4606}
  .teal rect{fill:#e3f2ec;stroke:#0f6e56;stroke-width:1}.teal .h{fill:#083f33}
  .red rect{fill:#fce9e9;stroke:#b9433a;stroke-width:1}
  .purp rect{fill:#eceafb;stroke:#534ab7;stroke-width:1}
</style>

<text x="20" y="20" class="kick">WHAT EACH PARADIGM HALLUCINATES, AND WHERE IT IS CAUGHT</text>

<g class="am"><rect x="20" y="30" width="312" height="34" rx="7"/><text x="176" y="51" class="h" text-anchor="middle">IMPERATIVE (A) · invents where the data lives</text></g>
<g class="am"><rect x="20" y="72" width="312" height="28" rx="5"/><text x="34" y="90" class="row">invents a nonexistent I/O path</text><text x="318" y="91" class="cnt" fill="#6b4606" text-anchor="end">51</text></g>
<g class="am"><rect x="20" y="104" width="312" height="28" rx="5"/><text x="34" y="122" class="row">invented / unsupported API</text><text x="318" y="123" class="cnt" fill="#6b4606" text-anchor="end">4</text></g>
<g class="red"><rect x="20" y="148" width="312" height="42" rx="7"/><text x="176" y="166" class="h" fill="#8f2f27" text-anchor="middle">caught only at runtime · 96% of error-iters</text><text x="176" y="182" class="t" fill="#8f2f27" text-anchor="middle">un-gateable → re-guessing loops, wasted compute</text></g>

<g class="teal"><rect x="348" y="30" width="312" height="34" rx="7"/><text x="504" y="51" class="h" text-anchor="middle">SDP (B) · confuses the paradigm</text></g>
<g class="teal"><rect x="348" y="72" width="312" height="28" rx="5"/><text x="362" y="90" class="row"><tspan class="mono">spark.conf.set()</tspan> inside a declarative pipeline</text><text x="646" y="91" class="cnt" fill="#083f33" text-anchor="end">76</text></g>
<g class="teal"><rect x="348" y="104" width="312" height="28" rx="5"/><text x="362" y="122" class="row">invented / undeclared table or view</text><text x="646" y="123" class="cnt" fill="#083f33" text-anchor="end">40</text></g>
<g class="teal"><rect x="348" y="136" width="312" height="28" rx="5"/><text x="362" y="154" class="row">eager <tspan class="mono">.collect()</tspan> inside a query function</text><text x="646" y="155" class="cnt" fill="#083f33" text-anchor="end">27</text></g>
<g class="teal"><rect x="348" y="170" width="312" height="20" rx="6"/><text x="504" y="184" class="t" fill="#0f6e56" text-anchor="middle">39% caught at the cheap dry-run gate, before compute</text></g>

<g class="purp"><rect x="136" y="204" width="408" height="30" rx="7"/><text x="340" y="223" class="t" fill="#3c3489" text-anchor="middle">the same <tspan class="mono">spark.conf.set</tspan> line — legitimate in imperative, a gate-caught hallucination in SDP</text></g>

<text x="340" y="250" class="t" text-anchor="middle">Databricks DLT hallucination (<tspan class="mono">import dlt</tspan>, <tspan class="mono">@dlt</tspan>): 0 in BOTH arms.</text>
<text x="340" y="266" class="t" text-anchor="middle">Imperative has no framework to confuse; the SDP arm's governed skill keeps it on the OSS API.</text>

<line x1="20" y1="280" x2="660" y2="280" stroke="#dbe4e0" stroke-width="1"/>
<text x="20" y="298" class="h" fill="#26312e">The gate catches a whole class of hallucination cheaply; imperative's dominant one is un-gateable.</text>
<text x="20" y="316" class="t">The arms hallucinate different things — the gate moves SDP's from runtime to a cheap pre-data check.</text>
</svg>
