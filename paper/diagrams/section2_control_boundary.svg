<svg width="100%" viewBox="0 0 720 372" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title>The control boundary: the imperative agent crosses it, the SDP agent stops at it</title>
<desc>One control boundary separates authoring from execution. The obvious way: an imperative agent holds a live SparkSession and credentials and calls df.write.saveAsTable, so authoring IS execution and the write crosses the boundary to touch data. The agent-native way: an SDP agent writes only @dp transforms, uses SparkSession.active() read-only, and produces an inert spec that stops at the boundary; only the platform crosses, carrying the spec through the dry-run gate and controller to the same execution engine.</desc>
<style>
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .kick{font-size:11px;font-weight:700;letter-spacing:.07em;fill:#5d6b66}
  .h{font-size:13px;font-weight:600;fill:#26312e}
  .sub{font-size:11.5px;fill:#5d6b66}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}
  .arr{stroke:#8a9690;stroke-width:1.5;fill:none}
  .am rect{fill:#f7efdd;stroke:#8a5a0b;stroke-width:1}.am .h{fill:#6b4606}
  .red rect{fill:#fce9e9;stroke:#b9433a;stroke-width:1}.red .h{fill:#8f2f27}
  .gray rect{fill:#eef3f0;stroke:#7d8a84;stroke-width:1}.gray .h{fill:#3c4642}
  .teal rect{fill:#e3f2ec;stroke:#0f6e56;stroke-width:1}.teal .h{fill:#083f33}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<defs><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="#b9433a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text x="16" y="18" class="kick">THE CONTROL BOUNDARY · THE IMPERATIVE AGENT CROSSES IT, THE SDP AGENT STOPS AT IT</text>
<text x="16" y="42" class="sub">AUTHORING · what the agent writes</text>
<text x="560" y="42" class="sub">EXECUTION</text>

<line x1="392" y1="50" x2="392" y2="352" stroke="#26312e" stroke-width="2"/>
<text x="376" y="200" class="sub" text-anchor="middle" transform="rotate(-90 376 200)" fill="#26312e">CONTROL BOUNDARY</text>

<g class="teal"><rect x="500" y="92" width="204" height="176" rx="9"/><text x="602" y="150" class="h" text-anchor="middle" fill="#083f33">EXECUTION</text><text x="602" y="169" class="sub" text-anchor="middle" fill="#0f6e56">driver + executor pods</text><text x="602" y="185" class="sub" text-anchor="middle" fill="#0f6e56">the only things that</text><text x="602" y="201" class="sub" text-anchor="middle" fill="#0f6e56">touch data</text></g>

<text x="24" y="72" class="sub" fill="#8a5a0b">THE OBVIOUS WAY · imperative agent (uncontained)</text>
<g class="am"><rect x="24" y="82" width="230" height="76" rx="8"/><text x="139" y="104" class="h" text-anchor="middle" fill="#6b4606">Imperative agent</text><text x="139" y="121" class="sub" text-anchor="middle" fill="#8a5a0b">holds a live SparkSession + credentials</text><text x="139" y="140" class="mono" text-anchor="middle" fill="#8f2f27">df.write.saveAsTable("gold")</text></g>
<line x1="254" y1="120" x2="498" y2="140" stroke="#b9433a" stroke-width="2" marker-end="url(#arR)"/>
<text x="386" y="94" class="sub" text-anchor="middle" fill="#b9433a">the write CROSSES the boundary</text>
<text x="386" y="108" class="sub" text-anchor="middle" fill="#b9433a">authoring IS execution · data touched</text>

<text x="24" y="208" class="sub" fill="#0f6e56">AGENT-NATIVE · the SDP agent writes, then stops</text>
<g class="red"><rect x="24" y="218" width="168" height="72" rx="8"/><text x="108" y="240" class="h" text-anchor="middle" fill="#8f2f27">SDP agent (untrusted)</text><text x="108" y="257" class="sub" text-anchor="middle" fill="#8f2f27">writes only @dp transforms</text><text x="108" y="274" class="mono" text-anchor="middle" fill="#5d6b66">Session.active() · read-only</text></g>
<g class="gray"><rect x="206" y="230" width="104" height="48" rx="7"/><text x="258" y="250" class="h" text-anchor="middle" fill="#3c4642">inert spec</text><text x="258" y="267" class="sub" text-anchor="middle" fill="#6b7a75">stops at the wall</text></g>
<g class="teal"><rect x="324" y="234" width="62" height="40" rx="7"/><text x="355" y="251" class="h" text-anchor="middle" fill="#083f33">gate +</text><text x="355" y="266" class="h" text-anchor="middle" fill="#083f33">controller</text></g>
<line x1="192" y1="254" x2="206" y2="254" class="arr" marker-end="url(#ar)"/>
<line x1="310" y1="254" x2="324" y2="254" class="arr" marker-end="url(#ar)"/>
<line x1="386" y1="254" x2="498" y2="230" stroke="#0f6e56" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="392" y="296" class="sub" text-anchor="middle" fill="#0f6e56">only the platform crosses: the spec goes via the gate and controller, never the agent</text>

<rect x="24" y="308" width="352" height="44" rx="7" fill="#eef3f0" stroke="#7d8a84" stroke-width=".7" stroke-dasharray="4 3"/>
<text x="34" y="326" class="sub" fill="#5d6b66">Absent from the agent's surface (I1/I2):</text>
<text x="34" y="342" class="sub" fill="#26312e">no session · no credentials · no endpoint · no cluster config · no run lifecycle</text>
</svg>
