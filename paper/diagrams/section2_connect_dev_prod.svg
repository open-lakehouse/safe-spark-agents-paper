<svg width="100%" viewBox="0 0 720 460" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title>Spark Connect: one client, one plan, two endpoints (dev-to-prod by changing SPARK_REMOTE)</title>
<desc>The client side is identical in dev and prod: the agent authors inert @dp transforms, a CI dry-run gate checks them, and a controller builds one serialized plan, holding no engine. That plan ships over gRPC to whatever SPARK_REMOTE points at. In dev the URL is a local Connect server with driver and executors in one in-process JVM. In prod the same plan goes to the EKS Spark Connect cluster, where a driver pod schedules executor pods that read the S3 warehouse through the Lakekeeper catalog behind mTLS. Promoting dev to prod changes only the URL; the server alone touches data.</desc>
<style>
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .kick{font-size:11px;font-weight:700;letter-spacing:.07em;fill:#5d6b66}
  .h{font-size:13px;font-weight:600;fill:#26312e}
  .sub{font-size:11px;fill:#5d6b66}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px}
  .arr{stroke:#8a9690;stroke-width:1.4;fill:none}
  .red rect{fill:#fce9e9;stroke:#b9433a;stroke-width:1}.red .h{fill:#8f2f27}
  .teal rect{fill:#e3f2ec;stroke:#0f6e56;stroke-width:1}.teal .h{fill:#083f33}
  .am rect{fill:#f7efdd;stroke:#8a5a0b;stroke-width:1}.am .h{fill:#6b4606}
  .board rect{fill:#f7f9f8;stroke:#7d8a84;stroke-width:1}
  .tiny{fill:#ffffff;stroke:#0f6e56;stroke-width:.9}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text x="16" y="16" class="kick">ONE CLIENT · ONE PLAN · TWO ENDPOINTS</text>

<g class="board"><rect x="14" y="32" width="216" height="330" rx="9"/><text x="122" y="50" class="h" fill="#3c3489" text-anchor="middle">THE CLIENT</text><text x="122" y="64" class="sub" text-anchor="middle">identical in dev and prod</text>
<g class="red"><rect x="30" y="74" width="184" height="44" rx="7"/><text x="122" y="93" class="h" text-anchor="middle" fill="#8f2f27">Agent</text><text x="122" y="109" class="sub" text-anchor="middle" fill="#8f2f27">authors inert @dp transforms</text></g>
<g class="red"><rect x="30" y="126" width="184" height="42" rx="7"/><text x="122" y="144" class="h" text-anchor="middle" fill="#8f2f27">SDP spec</text><text x="122" y="159" class="sub" text-anchor="middle" fill="#8f2f27">one inert artifact</text></g>
<g class="teal"><rect x="30" y="176" width="184" height="42" rx="7"/><text x="122" y="194" class="h" text-anchor="middle" fill="#083f33">CI dry-run gate</text><text x="122" y="209" class="sub" text-anchor="middle" fill="#5d6b66">structural check, no data</text></g>
<g class="teal"><rect x="30" y="226" width="184" height="54" rx="7"/><text x="122" y="245" class="h" text-anchor="middle" fill="#083f33">Controller</text><text x="122" y="261" class="sub" text-anchor="middle" fill="#0f6e56">builds ONE serialized plan</text><text x="122" y="274" class="sub" text-anchor="middle" fill="#0f6e56">no SparkContext, no engine</text></g>
<text x="122" y="298" class="sub" text-anchor="middle">same agent · spec · gate · plan</text>
<text x="122" y="311" class="sub" text-anchor="middle">in both modes</text>
<line x1="118" y1="118" x2="118" y2="126" class="arr" marker-end="url(#ar)"/>
<line x1="118" y1="168" x2="118" y2="176" class="arr" marker-end="url(#ar)"/>
<line x1="118" y1="218" x2="118" y2="226" class="arr" marker-end="url(#ar)"/>
</g>

<line x1="230" y1="253" x2="288" y2="253" class="arr" marker-end="url(#ar)"/>
<text x="258" y="246" class="sub" fill="#0f6e56" text-anchor="middle">plan</text>
<text x="258" y="267" class="mono" fill="#5d6b66" text-anchor="middle">gRPC</text>

<g class="am"><rect x="290" y="226" width="120" height="54" rx="8"/><text x="350" y="247" class="h" text-anchor="middle" fill="#6b4606">SPARK_REMOTE</text><text x="350" y="263" class="sub" text-anchor="middle" fill="#8a5a0b">the one thing</text><text x="350" y="276" class="sub" text-anchor="middle" fill="#8a5a0b">that changes</text></g>
<path d="M410 240 C 434 226, 440 110, 468 94" fill="none" stroke="#8a5a0b" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M410 262 C 434 276, 440 360, 468 376" fill="none" stroke="#8a5a0b" stroke-width="1.4" marker-end="url(#ar)"/>

<g class="teal"><rect x="472" y="34" width="232" height="116" rx="9"/><text x="486" y="52" class="h" fill="#083f33">DEV · local Connect server</text><g class="tiny"><rect x="486" y="62" width="204" height="42" rx="6"/></g><text x="588" y="80" class="sub" text-anchor="middle" fill="#083f33">driver + executors in ONE in-process JVM</text><text x="588" y="95" class="sub" text-anchor="middle" fill="#5d6b66">the whole engine in one JVM</text><text x="486" y="120" class="mono" fill="#5d6b66">sc://localhost:15002</text><text x="486" y="136" class="sub" fill="#8a5a0b">fast · free · ungoverned (dev only)</text></g>

<g class="teal"><rect x="472" y="238" width="232" height="180" rx="9"/><text x="486" y="256" class="h" fill="#083f33">PROD · EKS Spark Connect cluster</text><g class="tiny"><rect x="486" y="266" width="60" height="40" rx="5"/></g><text x="516" y="283" class="sub" text-anchor="middle" fill="#083f33">driver</text><text x="516" y="298" class="sub" text-anchor="middle" fill="#5d6b66">pod</text><g><rect class="tiny" x="554" y="266" width="40" height="17" rx="3"/><rect class="tiny" x="554" y="289" width="40" height="17" rx="3"/><rect class="tiny" x="600" y="266" width="40" height="17" rx="3"/><rect class="tiny" x="600" y="289" width="40" height="17" rx="3"/></g>
<g class="am"><rect x="518" y="320" width="46" height="20" rx="4"/></g><text x="541" y="334" class="sub" text-anchor="middle" fill="#6b4606">S3</text>
<text x="486" y="368" class="sub" fill="#5d6b66">Lakekeeper · mTLS · vended creds</text>
<text x="486" y="384" class="mono" fill="#5d6b66">sc://&lt;cluster-nlb&gt;:15009</text>
<text x="486" y="404" class="sub" fill="#0f6e56">executors alone touch data</text></g>

<text x="16" y="418" class="sub">Same client, same plan, same gate; only the URL changes, and the client never holds an engine.</text>
<text x="16" y="434" class="sub">The server (driver + executors) runs it and alone touches data; dev → prod is one <tspan class="mono" fill="#6b4606">SPARK_REMOTE</tspan> change.</text>
</svg>
