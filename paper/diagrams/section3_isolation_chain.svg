<svg width="100%" viewBox="0 0 680 486" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title>Section 3.3: the five-layer per-tenant isolation chain</title>
<desc>An agent authenticated as tenant A is routed to its own Connect server, handed only its own credential, run on its own executor pods, authorized at the catalog only for itself, and prefix-scoped at storage. Tenant B travels a fully separate lane. Five layers, all demonstrated on live EKS; an agent for tenant A cannot reach tenant B by any path.</desc>
<style>
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .kick{font-size:11px;font-weight:700;letter-spacing:.07em;fill:#5d6b66}
  .h{font-size:12.5px;font-weight:600;fill:#26312e}.sub{font-size:11px;fill:#5d6b66}
  .step{font-size:11px;font-weight:700;letter-spacing:.05em;fill:#5d6b66}
  .arr{stroke:#8a9690;stroke-width:1.5;fill:none}
  .a rect{fill:#e3f2ec;stroke:#0f6e56;stroke-width:1}.a .h{fill:#083f33}.a .sub{fill:#0f6e56}
  .b rect{fill:#eceafb;stroke:#534ab7;stroke-width:1}.b .h{fill:#3c3489}.b .sub{fill:#534ab7}
  .gate rect{fill:#eef3f0;stroke:#7d8a84;stroke-width:1}.gate .h{fill:#3c4642}.gate .sub{fill:#5d6b66}
  .pfx rect{fill:#ffffff;stroke:#7d8a84;stroke-width:.9;stroke-dasharray:3 2}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text x="40" y="20" class="kick">FIVE LAYERS, ALL DEMONSTRATED ON LIVE EKS</text>
<text x="640" y="20" class="sub" fill="#0f6e56" text-anchor="end">tenant A cannot reach tenant B by any path</text>

<g class="a"><rect x="48" y="32" width="284" height="42" rx="7"/><text x="190" y="51" class="h" text-anchor="middle" fill="#083f33">agent · tenant A</text><text x="190" y="66" class="sub" text-anchor="middle">cert SAN spiffe://…/tenant_a</text></g>
<g class="b"><rect x="356" y="32" width="284" height="42" rx="7"/><text x="498" y="51" class="h" text-anchor="middle" fill="#3c3489">agent · tenant B</text><text x="498" y="66" class="sub" text-anchor="middle">cert SAN spiffe://…/tenant_b</text></g>
<line x1="190" y1="74" x2="190" y2="90" class="arr" marker-end="url(#arrow)"/>
<line x1="498" y1="74" x2="498" y2="90" class="arr" marker-end="url(#arrow)"/>

<text x="48" y="106" class="step">1 · INGRESS ROUTING</text>
<g class="gate"><rect x="48" y="112" width="592" height="44" rx="7"/><text x="344" y="131" class="h" text-anchor="middle">mTLS gateway routes by cert principal to that tenant's own server</text><text x="344" y="147" class="sub" text-anchor="middle">tenant_a cert → server A · tenant_b cert → server B · un-granted → 403 · no cert → refused</text></g>
<line x1="190" y1="156" x2="190" y2="172" class="arr" marker-end="url(#arrow)"/>
<line x1="498" y1="156" x2="498" y2="172" class="arr" marker-end="url(#arrow)"/>

<text x="48" y="188" class="step">2 · TOKEN CUSTODY · each server injects only its own tenant's token</text>
<g class="a"><rect x="48" y="194" width="284" height="42" rx="7"/><text x="190" y="213" class="h" text-anchor="middle" fill="#083f33">spark-connect-tenant-a</text><text x="190" y="228" class="sub" text-anchor="middle">injects token A</text></g>
<g class="b"><rect x="356" y="194" width="284" height="42" rx="7"/><text x="498" y="213" class="h" text-anchor="middle" fill="#3c3489">spark-connect-tenant-b</text><text x="498" y="228" class="sub" text-anchor="middle">injects token B</text></g>
<line x1="190" y1="236" x2="190" y2="252" class="arr" marker-end="url(#arrow)"/>
<line x1="498" y1="236" x2="498" y2="252" class="arr" marker-end="url(#arrow)"/>

<text x="48" y="268" class="step">3 · EXECUTION ISOLATION · disjoint pods, never a shared JVM</text>
<g class="a"><rect x="48" y="274" width="284" height="42" rx="7"/><text x="190" y="293" class="h" text-anchor="middle" fill="#083f33">tenant_a executor pods</text><text x="190" y="308" class="sub" text-anchor="middle">own driver app</text></g>
<g class="b"><rect x="356" y="274" width="284" height="42" rx="7"/><text x="498" y="293" class="h" text-anchor="middle" fill="#3c3489">tenant_b executor pods</text><text x="498" y="308" class="sub" text-anchor="middle">separate driver app</text></g>
<line x1="190" y1="316" x2="190" y2="332" class="arr" marker-end="url(#arrow)"/>
<line x1="498" y1="316" x2="498" y2="332" class="arr" marker-end="url(#arrow)"/>

<text x="48" y="348" class="step">4 · CATALOG AUTHORIZATION</text>
<g class="gate"><rect x="48" y="354" width="592" height="44" rx="7"/><text x="344" y="373" class="h" text-anchor="middle">Lakekeeper + OpenFGA · grants each identity only its own warehouse</text><text x="344" y="389" class="sub" text-anchor="middle">tenant_a asking for tenant_b's table or vend → 404 · its own → 200</text></g>
<line x1="344" y1="398" x2="344" y2="414" class="arr" marker-end="url(#arrow)"/>

<text x="48" y="430" class="step">5 · STORAGE SCOPING</text>
<g class="gate"><rect x="48" y="436" width="592" height="44" rx="7"/><text x="120" y="462" class="h" text-anchor="middle" fill="#3c4642">S3 · prefix-scoped</text><g class="pfx"><rect x="240" y="444" width="170" height="22" rx="5"/></g><text x="325" y="459" class="sub" text-anchor="middle" fill="#3c4642">s3://…/tenant_a/</text><g class="pfx"><rect x="422" y="444" width="170" height="22" rx="5"/></g><text x="507" y="459" class="sub" text-anchor="middle" fill="#3c4642">s3://…/tenant_b/</text></g>
<text x="640" y="430" class="sub" fill="#b9433a" text-anchor="end">cross-tenant AccessDenied, both directions</text>
</svg>
