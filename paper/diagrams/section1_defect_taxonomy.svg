<svg width="100%" viewBox="0 0 680 312" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title>Section 1: defect taxonomy and what a structural gate can catch</title>
<desc>Defects split into three families. Structural defects (D1, D4, D5) are caught at the dry-run gate before any data. Semantic defects (D2, D6, D7, D8) are un-gateable by construction and ship as silent defects in completed output. State defects (D3, D9) are not scored offline.</desc>
<style>
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .kick{font-size:11px;font-weight:700;letter-spacing:.07em;fill:#5d6b66}
  .lbl{font-size:13px;font-weight:600;fill:#26312e}.sub{font-size:12px;fill:#5d6b66}
  .arr{stroke:#8a9690;stroke-width:1.5;fill:none}
  .teal rect{fill:#e3f2ec;stroke:#0f6e56;stroke-width:1}.teal .lbl{fill:#083f33}
  .red rect{fill:#fce9e9;stroke:#b9433a;stroke-width:1}.red .lbl{fill:#8f2f27}
  .gray rect{fill:#eef3f0;stroke:#7d8a84;stroke-width:1}.gray .lbl{fill:#3c4642}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text x="20" y="22" class="kick">DEFECT TAXONOMY · WHAT A STRUCTURAL GATE CAN AND CANNOT CATCH</text>

<g class="teal"><rect x="20" y="44" width="352" height="68" rx="8"/><text x="36" y="68" class="lbl">Structural</text><text x="36" y="90" class="sub">D1 unresolved column · D4 broken DAG</text><text x="36" y="103" class="sub">D5 immutable-config mutation</text></g>
<g class="red"><rect x="20" y="124" width="352" height="68" rx="8"/><text x="36" y="148" class="lbl">Semantic / silent</text><text x="36" y="170" class="sub">D2 timestamp · D6 dedup · D7 timezone</text><text x="36" y="183" class="sub">D8 silent row-drop</text></g>
<g class="gray"><rect x="20" y="204" width="352" height="52" rx="8"/><text x="36" y="228" class="lbl">State</text><text x="36" y="247" class="sub">D3 unwatermarked dedup · D9 unbounded state</text></g>

<g class="teal"><rect x="460" y="50" width="200" height="56" rx="8"/><text x="560" y="74" class="lbl" text-anchor="middle">Dry-run gate</text><text x="560" y="93" class="sub" text-anchor="middle">caught before any data</text></g>
<g class="red"><rect x="460" y="130" width="200" height="56" rx="8"/><text x="560" y="154" class="lbl" text-anchor="middle">Ships in output</text><text x="560" y="173" class="sub" text-anchor="middle">= silent defect</text></g>
<g class="gray"><rect x="460" y="200" width="200" height="56" rx="8"/><text x="560" y="224" class="lbl" text-anchor="middle">Not scored offline</text><text x="560" y="243" class="sub" text-anchor="middle">out of scope</text></g>

<line x1="372" y1="78" x2="460" y2="78" class="arr" marker-end="url(#arrow)"/>
<line x1="372" y1="158" x2="460" y2="158" class="arr" marker-end="url(#arrow)"/>
<line x1="372" y1="228" x2="460" y2="228" class="arr" marker-end="url(#arrow)"/>

<text x="20" y="284" class="sub" fill="#5d6b66">A paradigm effect appears only where the gate acts, or in how well the agent was taught the semantics.</text>
</svg>
