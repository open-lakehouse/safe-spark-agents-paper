<svg width="100%" viewBox="0 0 720 400" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title>The Spark Connect privilege ladder: agent, controller, cluster admin, and who can touch the engine</title>
<desc>Three privilege tiers separated by the Spark Connect boundary. The agent is an untrusted author holding only an inert @dp transform — no session, credentials, or endpoint — and cannot run anything, misconfigure, or reach a credential or SparkContext. The controller is a Connect client that submits serialized plans and holds the S3 credential, but cannot reach SparkContext, the JVM, RDDs, or cluster config; Connect errors if it tries. Below the boundary is the server side: the cluster admin owns the engine itself, SparkContext, the JVM, the executor pods, and cluster config. SparkContext never leaves the cluster admin's side.</desc>
<style>
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .kick{font-size:11px;font-weight:700;letter-spacing:.07em;fill:#5d6b66}
  .h{font-size:14px;font-weight:600;fill:#26312e}
  .role{font-size:11px;fill:#5d6b66}
  .k{font-size:10.5px;font-weight:700;letter-spacing:.05em}
  .v{font-size:11.5px;fill:#26312e}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px}
  .red rect{fill:#fce9e9;stroke:#b9433a;stroke-width:1}
  .red .rn rect{fill:#f3cfcf;stroke:#b9433a;stroke-width:1}
  .purp rect{fill:#eceafb;stroke:#534ab7;stroke-width:1}
  .purp .rn rect{fill:#dddbf2;stroke:#534ab7;stroke-width:1}
  .teal rect{fill:#e3f2ec;stroke:#0f6e56;stroke-width:1.2}
  .teal .rn rect{fill:#cfe9de;stroke:#0f6e56;stroke-width:1.2}
</style>

<text x="16" y="17" class="kick">THE SPARK CONNECT PRIVILEGE LADDER · WHO CAN TOUCH THE ENGINE</text>

<g class="red"><rect x="28" y="40" width="678" height="88" rx="9"/><g class="rn"><rect x="28" y="40" width="176" height="88" rx="9"/></g><text x="116" y="78" class="h" text-anchor="middle" fill="#8f2f27">AGENT</text><text x="116" y="95" class="role" text-anchor="middle" fill="#8f2f27">untrusted author</text><text x="116" y="109" class="role" text-anchor="middle" fill="#8f2f27">least privileged</text><text x="220" y="66" class="k" fill="#0f6e56">HOLDS</text><text x="220" y="83" class="v">an inert @dp transform</text><text x="220" y="100" class="role">no session · no credentials · no endpoint</text><text x="452" y="66" class="k" fill="#b9433a">CANNOT</text><text x="452" y="83" class="v">run anything · misconfigure · reach creds</text><text x="452" y="100" class="v">or the SparkContext</text></g>

<g class="purp"><rect x="28" y="132" width="678" height="88" rx="9"/><g class="rn"><rect x="28" y="132" width="176" height="88" rx="9"/></g><text x="116" y="170" class="h" text-anchor="middle" fill="#3c3489">CONTROLLER</text><text x="116" y="187" class="role" text-anchor="middle" fill="#534ab7">the Connect client</text><text x="116" y="201" class="role" text-anchor="middle" fill="#534ab7">(never the agent)</text><text x="220" y="158" class="k" fill="#0f6e56">HOLDS</text><text x="220" y="175" class="v">a Connect session · submits serialized plans</text><text x="220" y="192" class="v">+ the S3 credential that reads the warehouse</text><text x="452" y="158" class="k" fill="#b9433a">CANNOT</text><text x="452" y="175" class="v">SparkContext · JVM · RDDs · cluster config</text><text x="452" y="192" class="mono" fill="#8f2f27">Connect: JVM_ATTRIBUTE_NOT_SUPPORTED</text></g>

<line x1="28" y1="232" x2="706" y2="232" stroke="#7d8a84" stroke-width="2" stroke-dasharray="7 4"/>
<rect x="222" y="222" width="278" height="22" rx="11" fill="#eef3f0" stroke="#7d8a84" stroke-width="1"/>
<text x="361" y="237" class="k" fill="#3c4642" text-anchor="middle">SPARK CONNECT BOUNDARY</text>

<g class="teal"><rect x="28" y="252" width="678" height="92" rx="9"/><g class="rn"><rect x="28" y="252" width="176" height="92" rx="9"/></g><text x="116" y="292" class="h" text-anchor="middle" fill="#083f33">CLUSTER ADMIN</text><text x="116" y="309" class="role" text-anchor="middle" fill="#0f6e56">server side / operator</text><text x="116" y="323" class="role" text-anchor="middle" fill="#0f6e56">owns the engine</text><text x="220" y="278" class="k" fill="#0f6e56">OWNS THE ENGINE</text><text x="220" y="296" class="v">SparkContext · JVM · executor pods · cluster config</text><text x="220" y="313" class="role">the only tier that touches the running engine and data</text><g class="tiny"><rect x="556" y="282" width="140" height="46" rx="7" fill="#ffffff" stroke="#0f6e56" stroke-width="1"/></g><text x="626" y="302" class="v" text-anchor="middle">SparkContext</text><text x="626" y="317" class="role" text-anchor="middle">lives only here</text></g>

<text x="28" y="366" class="v" fill="#26312e">A plan can cross the line; the engine cannot be touched by a client.</text>
<text x="28" y="384" class="role">SparkContext never leaves the cluster admin's side: SDP never asks, imperative is stopped when it does.</text>
</svg>
