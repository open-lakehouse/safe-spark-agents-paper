<svg width="100%" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title>Credential custody: the credential's path never touches the agent</title>
<desc>The agent is untrusted and holds no credential; it only emits an inert spec and receives a pass/fail. On the governed side the catalog vends a short-lived scoped credential, the custodian (Section 4 / Omnigent) holds and injects it per session, and the Connect server and executors use it to reach only this tenant's data. The credential never crosses the trust boundary to the agent.</desc>
<style>
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .kick{font-size:11px;font-weight:700;letter-spacing:.07em;fill:#5d6b66}
  .h{font-size:12.5px;font-weight:600;fill:#26312e}.sub{font-size:11px;fill:#5d6b66}
  .arr{stroke:#8a9690;stroke-width:1.4;fill:none}
  .att rect{fill:#eef3f0;stroke:#7d8a84;stroke-width:1}.att .h{fill:#3c4642}
  .cat rect{fill:#e3f2ec;stroke:#0f6e56;stroke-width:1}.cat .h{fill:#083f33}
  .cus rect{fill:#eceafb;stroke:#534ab7;stroke-width:1}.cus .h{fill:#3c3489}
  .use rect{fill:#e3f2ec;stroke:#0f6e56;stroke-width:1}.use .h{fill:#083f33}
  .cred{fill:#f7efdd;stroke:#8a5a0b;stroke-width:.9}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text x="40" y="22" class="kick" fill="#5d6b66">UNTRUSTED</text>
<text x="300" y="22" class="kick" fill="#083f33">GOVERNED · THE CREDENTIAL LIVES HERE AND NEVER CROSSES LEFT</text>
<line x1="272" y1="30" x2="272" y2="286" stroke="#b9433a" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="262" y="150" class="sub" fill="#b9433a" text-anchor="middle" transform="rotate(-90 262 150)">§2 trust boundary</text>

<g class="att"><rect x="40" y="40" width="214" height="50" rx="7"/><text x="147" y="62" class="h" text-anchor="middle">AI agent (untrusted)</text><text x="147" y="79" class="sub" text-anchor="middle">holds no credential</text></g>
<text x="40" y="118" class="sub" fill="#3c4642">Its only exchange with the platform:</text>
<g class="att"><rect x="40" y="128" width="214" height="34" rx="6"/><text x="147" y="149" class="sub" text-anchor="middle">emits an inert spec + PR →</text></g>
<g class="att"><rect x="40" y="170" width="214" height="34" rx="6"/><text x="147" y="191" class="sub" text-anchor="middle">← receives a pass / fail</text></g>

<g class="cat"><rect x="300" y="40" width="340" height="46" rx="7"/><text x="470" y="60" class="h" text-anchor="middle" fill="#083f33">Governed catalog (Lakekeeper + OpenFGA)</text><text x="470" y="77" class="sub" text-anchor="middle">authorizes, then vends a short-lived scoped credential</text></g>
<g class="cus"><rect x="300" y="112" width="340" height="46" rx="7"/><text x="470" y="132" class="h" text-anchor="middle" fill="#3c3489">Custodian · §4 / Omnigent</text><text x="470" y="149" class="sub" text-anchor="middle">holds + rotates the vended credential, injects it per session</text></g>
<g class="use"><rect x="300" y="184" width="340" height="46" rx="7"/><text x="470" y="204" class="h" text-anchor="middle" fill="#083f33">Connect server → executors</text><text x="470" y="221" class="sub" text-anchor="middle">use it to reach only this tenant's data</text></g>
<g class="use"><rect x="300" y="252" width="340" height="30" rx="7"/><text x="470" y="271" class="h" text-anchor="middle" fill="#083f33">S3 · this tenant's prefix only</text></g>

<line x1="470" y1="86" x2="470" y2="112" class="arr" marker-end="url(#arrow)"/>
<line x1="470" y1="158" x2="470" y2="184" class="arr" marker-end="url(#arrow)"/>
<line x1="470" y1="230" x2="470" y2="252" class="arr" marker-end="url(#arrow)"/>
<rect class="cred" x="478" y="90" width="76" height="18" rx="9"/><text x="516" y="103" class="sub" fill="#8a5a0b" text-anchor="middle">credential</text>
</svg>
