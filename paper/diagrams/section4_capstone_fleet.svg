<svg width="100%" viewBox="0 0 680 396" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title>Section 4 (S4.5): Polly builds a governed medallion fleet for three customers over live per-tenant isolation</title>
<desc>Polly decomposes one data-engineering brief into per-customer bronze/silver/gold subtasks and fans out a cross-vendor fleet of credential-free sub-agents. Each is routed to a model by difficulty, cross-reviewed by a different vendor, and submitted to one custodian that holds every credential. The custodian runs each medallion over that customer's own Section 3 tenant, enforces contextual policy, and returns pass/fail; on failure the fleet repairs and converges. Cross-tenant reads are denied.</desc>
<style>
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .kick{font-size:11px;font-weight:700;letter-spacing:.07em;fill:#5d6b66}
  .h{font-size:12.5px;font-weight:600;fill:#26312e}.sub{font-size:11px;fill:#5d6b66}
  .arr{stroke:#8a9690;stroke-width:1.4;fill:none}
  .att rect{fill:#eef3f0;stroke:#7d8a84;stroke-width:1}.att .h{fill:#3c4642}
  .cus rect{fill:#eceafb;stroke:#534ab7;stroke-width:1}.cus .h{fill:#3c3489}
  .cat rect{fill:#e3f2ec;stroke:#0f6e56;stroke-width:1}.cat .h{fill:#083f33}
  .pol rect{fill:#f7efdd;stroke:#8a5a0b;stroke-width:.9}
  .rev rect{fill:#fce9e9;stroke:#b9433a;stroke-width:1}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text x="18" y="16" class="kick" fill="#3c3489">FLEET · credential-free · Omnigent-routed</text>
<text x="272" y="16" class="kick" fill="#3c3489">CUSTODIAN</text>
<text x="392" y="16" class="kick" fill="#083f33">LIVE §3 PER-TENANT ISOLATION (EKS)</text>

<g class="cus"><rect x="18" y="22" width="216" height="34" rx="7"/><text x="126" y="37" class="h" text-anchor="middle" fill="#3c3489">Polly (Omnigent) decomposes</text><text x="126" y="52" class="sub" text-anchor="middle">1 brief → 3-customer medallion DAG</text></g>
<line x1="126" y1="56" x2="126" y2="66" class="arr" marker-end="url(#arrow)"/>
<text x="136" y="64" class="sub" fill="#5d6b66">dispatches sub-agents</text>

<line x1="246" y1="20" x2="246" y2="258" stroke="#b9433a" stroke-width="1.1" stroke-dasharray="5 4"/>
<text x="238" y="140" class="sub" fill="#b9433a" text-anchor="middle" transform="rotate(-90 238 140)">§2 boundary</text>

<g class="att"><rect x="18" y="72" width="216" height="38" rx="6"/><text x="28" y="89" class="h">retail agent</text><text x="28" y="104" class="sub">qwen-coder:30b (local) → opus repair</text><text x="224" y="89" class="sub" fill="#8a5a0b" text-anchor="end">Low</text></g>
<g class="att"><rect x="18" y="114" width="216" height="38" rx="6"/><text x="28" y="131" class="h">saas agent</text><text x="28" y="146" class="sub">opus → opus repair</text><text x="224" y="131" class="sub" fill="#8a5a0b" text-anchor="end">High</text></g>
<g class="att"><rect x="18" y="156" width="216" height="38" rx="6"/><text x="28" y="173" class="h">payments agent</text><text x="28" y="188" class="sub">deepseek → opus repair</text><text x="224" y="173" class="sub" fill="#8a5a0b" text-anchor="end">Med</text></g>
<g class="rev"><rect x="18" y="202" width="216" height="34" rx="6"/><text x="28" y="217" class="h" fill="#8f2f27">cross-vendor review · gpt-5</text><text x="28" y="232" class="sub" fill="#8f2f27">caught silent defects the authors missed</text></g>
<line x1="120" y1="202" x2="120" y2="194" class="arr" marker-end="url(#arrow)"/>

<g class="cus"><rect x="258" y="64" width="112" height="150" rx="8"/><text x="314" y="82" class="h" text-anchor="middle" fill="#3c3489">Custodian</text><text x="314" y="97" class="sub" text-anchor="middle">holds PSK +</text><text x="314" y="111" class="sub" text-anchor="middle">every tenant token</text><rect x="270" y="120" width="88" height="34" rx="5" fill="#ffffff" stroke="#534ab7" stroke-width=".5" stroke-dasharray="3 2"/><text x="314" y="133" class="sub" text-anchor="middle" fill="#3c3489">submit(customer, code)</text><text x="314" y="147" class="sub" text-anchor="middle" fill="#3c3489">→ pass / fail</text><text x="314" y="170" class="sub" text-anchor="middle">agents get only</text><text x="314" y="184" class="sub" text-anchor="middle">pass/fail + policy</text></g>
<line x1="234" y1="90" x2="258" y2="118" class="arr" marker-end="url(#arrow)"/>
<line x1="234" y1="133" x2="258" y2="132" class="arr" marker-end="url(#arrow)"/>
<line x1="234" y1="176" x2="258" y2="150" class="arr" marker-end="url(#arrow)"/>

<g class="cat"><rect x="392" y="64" width="252" height="40" rx="6"/><text x="402" y="80" class="h" fill="#083f33">tenant_a · retail</text><text x="402" y="96" class="sub">own Connect · authz · vend · prefix</text></g>
<rect class="pol" x="514" y="76" width="70" height="15" rx="7"/><text x="549" y="87" class="sub" fill="#6b4606" text-anchor="middle">standard ✓</text>
<g class="cat"><rect x="392" y="116" width="252" height="40" rx="6"/><text x="402" y="132" class="h" fill="#083f33">tenant_b · saas</text><text x="402" y="148" class="sub">own Connect · authz · vend · prefix</text></g>
<rect class="pol" x="514" y="128" width="70" height="15" rx="7"/><text x="549" y="139" class="sub" fill="#6b4606" text-anchor="middle">PII-mask ✓</text>
<g class="cat"><rect x="392" y="168" width="252" height="40" rx="6"/><text x="402" y="184" class="h" fill="#083f33">tenant_c · payments</text><text x="402" y="200" class="sub">own Connect · authz · vend · prefix</text></g>
<rect class="pol" x="514" y="180" width="70" height="15" rx="7"/><text x="549" y="191" class="sub" fill="#6b4606" text-anchor="middle">financial ✓</text>
<line x1="370" y1="110" x2="392" y2="92" class="arr" marker-end="url(#arrow)"/>
<line x1="370" y1="140" x2="392" y2="140" class="arr" marker-end="url(#arrow)"/>
<line x1="370" y1="170" x2="392" y2="188" class="arr" marker-end="url(#arrow)"/>

<text x="392" y="236" class="sub" fill="#b9433a">cross-tenant reads DENIED · isolation holds</text>
<line x1="18" y1="244" x2="662" y2="244" stroke="#dbe4e0" stroke-width="1"/>

<text x="18" y="266" class="h" fill="#3c3489">Polly decomposed one brief; a cross-vendor fleet built three medallions over live isolation.</text>
<text x="18" y="284" class="sub">S4.1 routed vendors by difficulty (qwen / deepseek / opus) · S4.2 gpt-5 review caught silent defects.</text>
<text x="18" y="300" class="sub">S4.3 the custodian held every credential, the 3 agents held 0; routed cost $0.35.</text>
<text x="18" y="316" class="sub">§3 isolation preserved: each medallion materialized in its own tenant; every cross-tenant probe was denied.</text>
<text x="18" y="332" class="sub" fill="#8a5a0b">Demonstrates the mechanism (S4.5 core), not a powered numbers claim (SP4.2 is separate).</text>
<text x="18" y="348" class="sub" fill="#8a5a0b">Stage 1 = wrapper (Polly decomposes) · Stage 2 = native in Omnigent (custodian as a first-class tool).</text>
</svg>
