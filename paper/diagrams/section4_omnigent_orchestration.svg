<svg width="100%" viewBox="0 0 680 432" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title>Section 4: Omnigent governed multi-agent orchestration</title>
<desc>The Omnigent orchestrator provides four capabilities over a heterogeneous, credential-free agent fleet feeding the Section 3 governed platform: model routing for cost, cross-vendor review for quality, credential custody for governance (the demonstrated keystone), and a shared skill library for knowledge. All four mechanisms run in the capstone; only the quantitative cost and quality numbers are a separate, pre-registered study.</desc>
<style>
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .kick{font-size:11px;font-weight:700;letter-spacing:.07em;fill:#5d6b66}
  .h{font-size:13px;font-weight:600;fill:#26312e}.sub{font-size:11.5px;fill:#5d6b66}
  .arr{stroke:#8a9690;stroke-width:1.4;fill:none}
  .gray rect{fill:#eef3f0;stroke:#7d8a84;stroke-width:1}.gray .h{fill:#3c4642}
  .teal rect{fill:#e3f2ec;stroke:#0f6e56;stroke-width:1}.teal .h{fill:#083f33}
  .purp rect{fill:#eceafb;stroke:#534ab7;stroke-width:1}.purp .h{fill:#3c3489}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text x="20" y="20" class="kick">OMNIGENT · ONE ORCHESTRATOR, A CREDENTIAL-FREE FLEET</text>
<line x1="368" y1="13" x2="394" y2="13" class="arr"/><text x="398" y="17" class="sub">demonstrated mechanism</text>
<line x1="546" y1="13" x2="572" y2="13" class="arr" stroke-dasharray="1.5 3"/><text x="576" y="17" class="sub">numbers separate</text>

<rect x="20" y="30" width="640" height="150" rx="10" fill="none" stroke="#534ab7" stroke-width="1" stroke-dasharray="4 4"/>
<text x="34" y="48" class="sub" fill="#3c3489">Omnigent orchestrator · one custodian atop §3 (not N raw sessions)</text>
<g class="purp"><rect x="34" y="60" width="296" height="50" rx="7"/><text x="182" y="82" class="h" text-anchor="middle" fill="#3c3489">Model routing</text><text x="182" y="99" class="sub" text-anchor="middle">cost · cheap vs strong model</text></g>
<g class="purp"><rect x="344" y="60" width="302" height="50" rx="7"/><text x="495" y="82" class="h" text-anchor="middle" fill="#3c3489">Cross-vendor review</text><text x="495" y="99" class="sub" text-anchor="middle">quality · catches blind spots</text></g>
<g class="purp"><rect x="34" y="120" width="296" height="50" rx="7"/><text x="182" y="142" class="h" text-anchor="middle" fill="#3c3489">Credential custody</text><text x="182" y="159" class="sub" text-anchor="middle">governance · the demonstrated keystone</text></g>
<g class="purp"><rect x="344" y="120" width="302" height="50" rx="7"/><text x="495" y="142" class="h" text-anchor="middle" fill="#3c3489">Shared skill library</text><text x="495" y="159" class="sub" text-anchor="middle">knowledge · fleet-wide floor</text></g>

<line x1="182" y1="180" x2="182" y2="216" class="arr" marker-end="url(#arrow)"/>
<line x1="495" y1="180" x2="495" y2="216" class="arr" marker-end="url(#arrow)"/>

<g class="gray"><rect x="70" y="224" width="175" height="54" rx="7"/><text x="157" y="246" class="h" text-anchor="middle">claude_code</text><text x="157" y="264" class="sub" text-anchor="middle">credential-free</text></g>
<g class="gray"><rect x="253" y="224" width="174" height="54" rx="7"/><text x="340" y="246" class="h" text-anchor="middle">codex</text><text x="340" y="264" class="sub" text-anchor="middle">credential-free</text></g>
<g class="gray"><rect x="435" y="224" width="175" height="54" rx="7"/><text x="522" y="246" class="h" text-anchor="middle">pi</text><text x="522" y="264" class="sub" text-anchor="middle">credential-free</text></g>
<text x="340" y="296" class="sub" fill="#5d6b66" text-anchor="middle">a heterogeneous, credential-free agent fleet</text>
<path d="M182 278 V302 H196 V328" fill="none" class="arr" marker-end="url(#arrow)"/>
<path d="M495 278 V302 H196 V328" fill="none" class="arr"/>

<rect x="20" y="332" width="640" height="80" rx="10" fill="none" stroke="#0f6e56" stroke-width="1" stroke-dasharray="4 4"/>
<text x="34" y="352" class="sub" fill="#083f33">§3 governed platform · the substrate Omnigent sits on</text>
<g class="teal"><rect x="34" y="362" width="196" height="42" rx="7"/><text x="132" y="380" class="h" text-anchor="middle" fill="#083f33">GitOps gate</text><text x="132" y="396" class="sub" text-anchor="middle">PR dry-run vs catalog</text></g>
<g class="teal"><rect x="242" y="362" width="186" height="42" rx="7"/><text x="335" y="380" class="h" text-anchor="middle" fill="#083f33">Connect ingress</text><text x="335" y="396" class="sub" text-anchor="middle">single mTLS door</text></g>
<g class="teal"><rect x="440" y="362" width="206" height="42" rx="7"/><text x="543" y="380" class="h" text-anchor="middle" fill="#083f33">k8s execution</text><text x="543" y="396" class="sub" text-anchor="middle">driver + executor pods</text></g>
</svg>
