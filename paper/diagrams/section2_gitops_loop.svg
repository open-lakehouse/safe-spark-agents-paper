<svg width="100%" viewBox="0 0 720 464" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title>The agent-native dev loop: author, open a PR, gate on CI, reconcile over Connect</title>
<desc>An untrusted agent authors an inert SDP spec (no session, credentials, or config) and its only action is to open a pull request. CI gates the PR with a spark-pipelines dry-run that validates the dataflow graph without touching data: valid reports Run is COMPLETED, broken fails with TABLE_OR_VIEW_NOT_FOUND and feeds back to the agent. Only on merge does a controller, never the agent, run spark-pipelines run over Spark Connect, shipping plans over mTLS to driver and executor pods that materialize tables to the governed catalog and S3 with the controller's credential. The same loop targets a local Connect server in dev or the cluster in prod by changing SPARK_REMOTE.</desc>
<style>
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .kick{font-size:11px;font-weight:700;letter-spacing:.07em;fill:#5d6b66}
  .h{font-size:13px;font-weight:600;fill:#26312e}
  .sub{font-size:11px;fill:#5d6b66}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px}
  .arr{stroke:#8a9690;stroke-width:1.4;fill:none}
  .red rect{fill:#fce9e9;stroke:#b9433a;stroke-width:1}.red .h{fill:#8f2f27}
  .teal rect{fill:#e3f2ec;stroke:#0f6e56;stroke-width:1}.teal .h{fill:#083f33}
  .purp rect{fill:#eceafb;stroke:#534ab7;stroke-width:1}.purp .h{fill:#3c3489}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text x="16" y="16" class="kick">THE AGENT-NATIVE DEV LOOP · AUTHOR → PR → GATE → RECONCILE OVER CONNECT</text>

<text x="16" y="42" class="sub" fill="#8f2f27">UNTRUSTED AUTHOR</text>
<g class="red"><rect x="16" y="50" width="180" height="48" rx="7"/><text x="106" y="70" class="h" text-anchor="middle" fill="#8f2f27">Agent</text><text x="106" y="87" class="sub" text-anchor="middle" fill="#8f2f27">no session, no creds, no config</text></g>
<g class="red"><rect x="16" y="112" width="180" height="48" rx="7"/><text x="106" y="132" class="h" text-anchor="middle" fill="#8f2f27">SDP spec</text><text x="106" y="149" class="sub" text-anchor="middle" fill="#8f2f27">inert @dp transforms</text></g>
<g class="red"><rect x="16" y="174" width="180" height="48" rx="7"/><text x="106" y="194" class="h" text-anchor="middle" fill="#8f2f27">Pull request</text><text x="106" y="211" class="sub" text-anchor="middle" fill="#8f2f27">the only interface in</text></g>
<line x1="106" y1="98" x2="106" y2="112" class="arr" marker-end="url(#ar)"/>
<line x1="106" y1="160" x2="106" y2="174" class="arr" marker-end="url(#ar)"/>

<line x1="212" y1="44" x2="212" y2="444" stroke="#b9433a" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="198" y="128" class="sub" fill="#b9433a" text-anchor="middle" transform="rotate(-90 198 128)">control boundary</text>

<text x="236" y="42" class="sub" fill="#083f33">GOVERNED PLATFORM</text>

<line x1="196" y1="198" x2="248" y2="198" class="arr" marker-end="url(#ar)"/>
<g class="teal"><rect x="250" y="158" width="310" height="84" rx="8"/><text x="405" y="176" class="h" text-anchor="middle" fill="#083f33">CI gate</text><text x="405" y="192" class="mono" text-anchor="middle" fill="#5d6b66">spark-pipelines dry-run --spec orders/spark-pipeline.yml</text><text x="405" y="208" class="sub" text-anchor="middle" fill="#5d6b66">builds + validates the graph · touches no data</text><text x="405" y="225" class="sub" text-anchor="middle" fill="#0f6e56">valid: Run is COMPLETED</text><text x="405" y="239" class="sub" text-anchor="middle" fill="#b9433a">broken: TABLE_OR_VIEW_NOT_FOUND</text></g>
<line x1="248" y1="231" x2="196" y2="231" class="arr" stroke="#b9433a" stroke-dasharray="5 3" marker-end="url(#ar)"/>
<text x="222" y="252" class="sub" fill="#b9433a" text-anchor="middle">feedback, no data touched</text>

<line x1="405" y1="242" x2="405" y2="284" class="arr" marker-end="url(#ar)"/>
<text x="413" y="265" class="sub" fill="#5d6b66">on merge (valid only)</text>

<g class="purp"><rect x="250" y="288" width="224" height="62" rx="8"/><text x="362" y="308" class="h" text-anchor="middle" fill="#3c3489">Controller (never the agent)</text><text x="362" y="325" class="mono" text-anchor="middle" fill="#5d6b66">spark-pipelines run --spec</text><text x="362" y="341" class="sub" text-anchor="middle" fill="#534ab7">a Connect client, ships plans not code</text></g>
<g class="teal"><rect x="494" y="288" width="92" height="62" rx="8"/><text x="540" y="313" class="h" text-anchor="middle" fill="#083f33">Connect</text><text x="540" y="332" class="sub" text-anchor="middle" fill="#0f6e56">plans · mTLS</text></g>
<g class="teal"><rect x="600" y="288" width="100" height="62" rx="8"/><text x="650" y="313" class="h" text-anchor="middle" fill="#083f33">Cluster</text><text x="650" y="332" class="sub" text-anchor="middle" fill="#0f6e56">driver + exec pods</text></g>
<line x1="474" y1="319" x2="494" y2="319" class="arr" marker-end="url(#ar)"/>
<line x1="586" y1="319" x2="600" y2="319" class="arr" marker-end="url(#ar)"/>

<line x1="650" y1="350" x2="650" y2="382" class="arr" marker-end="url(#ar)"/>
<g class="teal"><rect x="392" y="386" width="340" height="44" rx="8"/><text x="562" y="405" class="h" text-anchor="middle" fill="#083f33">materialized tables · governed catalog + S3</text><text x="562" y="421" class="sub" text-anchor="middle" fill="#5d6b66">read with the controller's credential, never the agent's</text></g>

<text x="16" y="452" class="sub" fill="#8a5a0b">Same loop, two endpoints: local Connect (dev) or the cluster (prod) — change SPARK_REMOTE only.</text>
</svg>
