<svg width="100%" viewBox="0 0 680 252" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title>Section 1: the study run-loop for one cell</title>
<desc>For each (task, arm, seed): generate seeded data, the agent proposes a pipeline, arm B passes a structural SDP dry-run gate before execution while arm A has no gate, execute on Spark, blind-grade against ground truth, and record cost. Failures feed back to the agent up to an iteration cap.</desc>
<style>
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .kick{font-size:11px;font-weight:700;letter-spacing:.07em;fill:#5d6b66}
  .lbl{font-size:13px;font-weight:600;fill:#26312e}.sub{font-size:11.5px;fill:#5d6b66}
  .arr{stroke:#8a9690;stroke-width:1.5;fill:none}
  .gray rect{fill:#eef3f0;stroke:#7d8a84;stroke-width:1}.gray .lbl{fill:#3c4642}
  .teal rect{fill:#e3f2ec;stroke:#0f6e56;stroke-width:1}.teal .lbl{fill:#083f33}
  .am{stroke:#8a5a0b;stroke-width:1.5;fill:none;stroke-dasharray:5 3}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text x="20" y="22" class="kick">THE STUDY RUN-LOOP, FOR ONE CELL</text>

<path d="M213 132 V84 H447 V132" class="am" marker-end="url(#arrow)"/>
<text x="330" y="76" class="sub" fill="#8a5a0b" text-anchor="middle">arm A (imperative) · no gate</text>

<g class="gray"><rect x="20" y="120" width="110" height="58" rx="7"/><text x="75" y="145" class="lbl" text-anchor="middle">Generate</text><text x="75" y="162" class="sub" text-anchor="middle">seeded data</text></g>
<g class="gray"><rect x="137" y="120" width="110" height="58" rx="7"/><text x="192" y="145" class="lbl" text-anchor="middle">Propose</text><text x="192" y="162" class="sub" text-anchor="middle">pipeline code</text></g>
<g class="teal"><rect x="254" y="120" width="110" height="58" rx="7"/><text x="309" y="145" class="lbl" text-anchor="middle">Dry-run</text><text x="309" y="162" class="sub" text-anchor="middle">arm B · pre-data</text></g>
<g class="teal"><rect x="371" y="120" width="110" height="58" rx="7"/><text x="426" y="145" class="lbl" text-anchor="middle">Execute</text><text x="426" y="162" class="sub" text-anchor="middle">local / EKS</text></g>
<g class="gray"><rect x="488" y="120" width="130" height="58" rx="7"/><text x="553" y="145" class="lbl" text-anchor="middle">Grade</text><text x="553" y="162" class="sub" text-anchor="middle">blind · record cost</text></g>

<line x1="130" y1="149" x2="137" y2="149" class="arr" marker-end="url(#arrow)"/>
<line x1="247" y1="149" x2="254" y2="149" class="arr" marker-end="url(#arrow)"/>
<line x1="364" y1="149" x2="371" y2="149" class="arr" marker-end="url(#arrow)"/>
<line x1="481" y1="149" x2="488" y2="149" class="arr" marker-end="url(#arrow)"/>

<path d="M553 178 V208 H192 V178" class="arr" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<text x="372" y="226" class="sub" text-anchor="middle">failure feeds back · retry to the iteration cap</text>
</svg>
