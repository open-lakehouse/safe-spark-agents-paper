<svg width="100%" viewBox="0 0 680 312" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title>Section 4 (S4.3): the Omnigent credential custodian at fleet scale</title>
<desc>A fleet of untrusted, credential-free agents submits inert specs to one Omnigent custodian and receives only pass or fail. The custodian holds and rotates every per-tenant credential, minting a fresh short-lived token per job and running the work over the Section 3 governed catalog and per-tenant storage. Credentials never cross the trust boundary back to the agents, and Section 3's per-tenant isolation is preserved under custody.</desc>
<style>
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .kick{font-size:11px;font-weight:700;letter-spacing:.07em;fill:#5d6b66}
  .h{font-size:12.5px;font-weight:600;fill:#26312e}.sub{font-size:11px;fill:#5d6b66}
  .arr{stroke:#8a9690;stroke-width:1.4;fill:none}
  .att rect{fill:#eef3f0;stroke:#7d8a84;stroke-width:1}.att .h{fill:#3c4642}
  .cus rect{fill:#eceafb;stroke:#534ab7;stroke-width:1}.cus .h{fill:#3c3489}
  .cat rect{fill:#e3f2ec;stroke:#0f6e56;stroke-width:1}.cat .h{fill:#083f33}
  .cred{fill:#f7efdd;stroke:#8a5a0b;stroke-width:.9}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text x="40" y="20" class="kick" fill="#5d6b66">UNTRUSTED FLEET · NO CREDENTIAL</text>
<text x="300" y="20" class="kick" fill="#3c3489">OMNIGENT CUSTODIAN · HOLDS + ROTATES EVERY CREDENTIAL</text>
<line x1="238" y1="28" x2="238" y2="204" stroke="#b9433a" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="230" y="116" class="sub" fill="#b9433a" text-anchor="middle" transform="rotate(-90 230 116)">§2 boundary</text>

<g class="att"><rect x="40" y="40" width="180" height="34" rx="6"/><text x="130" y="55" class="h" text-anchor="middle">agent A1 · tenant A</text><text x="130" y="69" class="sub" text-anchor="middle">emits spec + PR</text></g>
<g class="att"><rect x="40" y="84" width="180" height="34" rx="6"/><text x="130" y="99" class="h" text-anchor="middle">agent B1 · tenant B</text><text x="130" y="113" class="sub" text-anchor="middle">emits spec + PR</text></g>
<g class="att"><rect x="40" y="128" width="180" height="34" rx="6"/><text x="130" y="143" class="h" text-anchor="middle">agent A2 · tenant A</text><text x="130" y="157" class="sub" text-anchor="middle">emits spec + PR</text></g>
<text x="130" y="182" class="sub" fill="#3c4642" text-anchor="middle">each receives only a pass / fail</text>

<g class="cus"><rect x="300" y="52" width="184" height="130" rx="8"/><text x="392" y="74" class="h" text-anchor="middle" fill="#3c3489">Custodian</text><text x="392" y="92" class="sub" text-anchor="middle">mints a fresh short-lived</text><text x="392" y="106" class="sub" text-anchor="middle">token per job (rotation)</text><rect x="316" y="116" width="152" height="56" rx="6" fill="#ffffff" stroke="#534ab7" stroke-width=".6" stroke-dasharray="3 2"/><text x="392" y="134" class="sub" text-anchor="middle" fill="#3c3489">vault, never handed back:</text><text x="392" y="152" class="sub" text-anchor="middle" fill="#8a5a0b">credA#3 · credB#2 · credA#1 …</text><text x="392" y="169" class="sub" text-anchor="middle" fill="#534ab7">held only here</text></g>
<line x1="220" y1="100" x2="300" y2="110" class="arr" marker-end="url(#arrow)"/>
<text x="252" y="100" class="sub" fill="#5d6b66">spec →</text>
<line x1="300" y1="140" x2="220" y2="140" class="arr" marker-end="url(#arrow)"/>
<text x="250" y="135" class="sub" fill="#5d6b66">← pass/fail</text>

<line x1="484" y1="117" x2="552" y2="117" class="arr" marker-end="url(#arrow)"/>
<text x="512" y="110" class="sub" fill="#5d6b66">mint + vend</text>
<rect class="cred" x="492" y="92" width="72" height="16" rx="8"/><text x="528" y="104" class="sub" fill="#8a5a0b" text-anchor="middle">credential</text>

<g class="cat"><rect x="552" y="52" width="108" height="52" rx="7"/><text x="606" y="74" class="h" text-anchor="middle" fill="#083f33">§3 catalog</text><text x="606" y="91" class="sub" text-anchor="middle">per-principal authz</text></g>
<g class="cat"><rect x="552" y="118" width="108" height="52" rx="7"/><text x="606" y="140" class="h" text-anchor="middle" fill="#083f33">per-tenant</text><text x="606" y="157" class="sub" text-anchor="middle">storage (scoped)</text></g>
<line x1="606" y1="104" x2="606" y2="118" class="arr" marker-end="url(#arrow)"/>

<text x="40" y="232" class="h" fill="#3c3489">One custodian, N credential-free agents.</text>
<text x="40" y="250" class="sub">Demonstrated: 1 custodian governed 2 tenants, minted + rotated 3 short-lived credentials; agents held 0.</text>
<text x="40" y="264" class="sub">An agent's cross-tenant read was refused (PERMISSION_DENIED), so §3's isolation holds under custody.</text>
<text x="40" y="284" class="sub" fill="#8a5a0b">Frontier: scale-out (many tenants + node autoscaling) and rotation under live long-running jobs.</text>
</svg>
