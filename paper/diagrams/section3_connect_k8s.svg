<svg width="100%" viewBox="0 0 720 462" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title>Connect on Kubernetes: one governed mTLS door, elastic executor pods on a separate node pool behind it</title>
<desc>A Connect client reaches the cluster only through one external mTLS endpoint on port 15009. That endpoint is an Envoy sidecar in the Spark Connect driver pod, which pins the caller's principal and forwards over loopback to the Connect server on 127.0.0.1:15002 (never externally reachable). The driver pod is a singleton on the untainted system node pool and is the client-mode Spark driver: through an RBAC service account it schedules executor pods on a separate tainted executor pool (spark-role=executor), scaling 0 to 10 by dynamic allocation. Executors read the S3 Iceberg warehouse with the vended, prefix-scoped credentials.</desc>
<style>
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .kick{font-size:11px;font-weight:700;letter-spacing:.07em;fill:#5d6b66}
  .h{font-size:12.5px;font-weight:600;fill:#26312e}
  .sub{font-size:11px;fill:#5d6b66}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px}
  .arr{stroke:#8a9690;stroke-width:1.4;fill:none}
  .z{font-size:11px;font-weight:700;letter-spacing:.05em}
  .purp rect{fill:#eceafb;stroke:#534ab7;stroke-width:1}
  .teal rect{fill:#e3f2ec;stroke:#0f6e56;stroke-width:1}
  .am rect{fill:#f7efdd;stroke:#8a5a0b;stroke-width:1}
  .white rect{fill:#ffffff;stroke:#0f6e56;stroke-width:1}
  .node rect{fill:#ffffff;stroke:#8a5a0b;stroke-width:1}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text x="16" y="16" class="kick">CONNECT ON KUBERNETES · ONE GOVERNED mTLS DOOR, ELASTIC EXECUTORS BEHIND IT</text>

<g class="purp"><rect x="14" y="150" width="128" height="56" rx="7"/><text x="78" y="173" class="h" text-anchor="middle" fill="#3c3489">Connect client</text><text x="78" y="190" class="sub" text-anchor="middle">controller / agent</text></g>
<line x1="142" y1="178" x2="196" y2="178" stroke="#8a5a0b" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="168" y="171" class="sub" fill="#8a5a0b" text-anchor="middle">mTLS</text>
<text x="168" y="196" class="mono" fill="#8a5a0b" text-anchor="middle">:15009</text>

<rect x="198" y="34" width="300" height="258" rx="10" fill="none" stroke="#8a5a0b" stroke-width="1" stroke-dasharray="6 4"/>
<text x="212" y="52" class="z" fill="#8a5a0b">SYSTEM NODE POOL · untainted</text>

<g class="white"><rect x="212" y="62" width="272" height="180" rx="8"/><text x="348" y="80" class="h" text-anchor="middle" fill="#083f33">Spark Connect driver pod (replicas: 1)</text>
<g class="teal"><rect x="224" y="92" width="112" height="60" rx="6"/><text x="280" y="110" class="h" text-anchor="middle" fill="#083f33">Envoy mTLS</text><text x="280" y="126" class="sub" text-anchor="middle">:15009 · external</text><text x="280" y="141" class="sub" text-anchor="middle">pins principal</text></g>
<g class="teal"><rect x="360" y="92" width="112" height="60" rx="6"/><text x="416" y="110" class="h" text-anchor="middle" fill="#083f33">Connect server</text><text x="416" y="126" class="mono" text-anchor="middle">127.0.0.1:15002</text><text x="416" y="141" class="sub" text-anchor="middle">loopback only</text></g>
<line x1="336" y1="122" x2="360" y2="122" class="arr" marker-end="url(#ar)"/>
<text x="348" y="167" class="mono" fill="#5d6b66">client-mode driver · spark.master=k8s://…</text>
<text x="348" y="181" class="sub" text-anchor="middle" fill="#5d6b66">deployMode=client · driver.host=$(POD_IP)</text>
<text x="348" y="196" class="sub" text-anchor="middle" fill="#5d6b66">RBAC: create / watch / delete pods (own ns)</text>
<text x="348" y="215" class="sub" text-anchor="middle" fill="#8a5a0b">only :15009 is external · :15002 is Envoy-only</text></g>
<line x1="196" y1="178" x2="224" y2="136" stroke="#8a5a0b" stroke-width="1.6" marker-end="url(#ar)"/>

<line x1="348" y1="242" x2="348" y2="268" class="arr" marker-end="url(#ar)"/>
<g class="teal"><rect x="252" y="270" width="192" height="36" rx="7" fill="#eef3f0"/><text x="348" y="287" class="sub" text-anchor="middle" fill="#3c4642">kube API · kubernetes.default.svc</text></g>

<rect x="510" y="34" width="196" height="310" rx="10" fill="none" stroke="#0f6e56" stroke-width="1" stroke-dasharray="6 4"/>
<text x="522" y="52" class="z" fill="#083f33">EXECUTOR POOL</text>
<text x="522" y="67" class="sub" fill="#0f6e56">taint: spark-role=executor</text>
<g class="node"><rect x="524" y="80" width="168" height="40" rx="6"/><text x="608" y="97" class="h" text-anchor="middle" fill="#083f33">executor pod</text><text x="608" y="113" class="sub" text-anchor="middle">2 cores / 2g</text></g>
<g class="node"><rect x="524" y="126" width="168" height="40" rx="6"/><text x="608" y="143" class="h" text-anchor="middle" fill="#083f33">executor pod</text><text x="608" y="159" class="sub" text-anchor="middle">2 cores / 2g</text></g>
<g class="node"><rect x="524" y="172" width="168" height="40" rx="6" stroke-dasharray="3 2"/><text x="608" y="189" class="h" text-anchor="middle" fill="#5d6b66">executor pod …</text><text x="608" y="205" class="sub" text-anchor="middle" fill="#6b7a75">up to 10 · dynamic alloc</text></g>
<text x="522" y="228" class="sub" fill="#8a5a0b">dynamic 0 → 10 · spread</text>
<g class="am"><rect x="524" y="236" width="168" height="40" rx="7"/><text x="608" y="253" class="h" text-anchor="middle" fill="#6b4606">S3 warehouse (Iceberg)</text><text x="608" y="269" class="sub" text-anchor="middle">vended prefix-scoped creds</text></g>
<line x1="608" y1="214" x2="608" y2="234" class="arr" marker-end="url(#ar)"/>
<line x1="444" y1="288" x2="524" y2="200" class="arr" marker-end="url(#ar)"/>
<text x="492" y="250" class="sub" fill="#5d6b66" text-anchor="middle">creates</text>

<text x="16" y="380" class="sub">One shared Connect driver serves many sessions; execution scales elastically on a separate, tainted node pool.</text>
<text x="16" y="398" class="sub">Scaling happens behind the governed mTLS door (:15009), never around it; the two pools keep driver and executors apart.</text>
<text x="16" y="420" class="sub" fill="#8a5a0b">Demonstrated with a spark.range(80M).sum() probe on the cluster's executors:</text>
<text x="16" y="437" class="sub" fill="#8a5a0b">1.246 exec-s · 0.878 cpu-s — a small probe, not a parallelism benchmark.</text>
</svg>
