<svg width="100%" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title>§1.4.2: where structural defects are caught, SDP's gate vs bare imperative</title>
<desc>Structural defects (D1, D4, D5) reach a boundary marked "before any data is processed." Bare imperative has no structural gate, so zero are caught before data; four surface later at runtime, after executors have run and compute is spent. SDP runs a framework dry-run at that boundary and catches 79 defects before any data is processed; 30 more surface at runtime; neither arm ships a structural defect.</desc>
<style>
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .kick{font-size:11px;font-weight:700;letter-spacing:.07em;fill:#5d6b66}
  .lbl{font-size:13px;font-weight:600;fill:#26312e}.sub{font-size:11.5px;fill:#5d6b66}
  .big{font-size:26px;font-weight:700}
  .arr{stroke:#8a9690;stroke-width:1.5;fill:none}
  .am rect{fill:#f7efdd;stroke:#8a5a0b;stroke-width:1}.am .lbl{fill:#6b4606}.am .sub{fill:#8a5a0b}
  .teal rect{fill:#e3f2ec;stroke:#0f6e56;stroke-width:1}.teal .lbl{fill:#083f33}.teal .sub{fill:#0f6e56}
  .bnd{stroke:#b9433a;stroke-width:1.5;stroke-dasharray:6 4}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text x="20" y="20" class="kick">WHERE STRUCTURAL DEFECTS (D1 / D4 / D5) ARE CAUGHT · THE LOAD-BEARING RESULT</text>

<line x1="356" y1="40" x2="356" y2="240" class="bnd"/>
<text x="348" y="52" class="sub" fill="#b9433a" text-anchor="end">◀ before any data</text>
<text x="364" y="52" class="sub" fill="#b9433a">after: executors run ▶</text>
<text x="356" y="252" class="sub" fill="#b9433a" text-anchor="middle">the dry-run gate sits on this line</text>

<g class="am"><rect x="20" y="76" width="150" height="50" rx="7"/><text x="95" y="99" class="lbl" text-anchor="middle">Imperative (bare)</text><text x="95" y="116" class="sub" text-anchor="middle">no structural gate</text></g>
<line x1="170" y1="101" x2="314" y2="101" class="arr" marker-end="url(#arrow)"/>
<circle cx="356" cy="101" r="22" fill="#ffffff" stroke="#7d8a84" stroke-width="1.25"/>
<text x="356" y="109" class="big" fill="#7d8a84" text-anchor="middle">0</text>
<text x="356" y="138" class="sub" fill="#6b7a75" text-anchor="middle">nothing caught early</text>
<g class="am"><rect x="478" y="76" width="182" height="50" rx="7"/><text x="569" y="99" class="lbl" text-anchor="middle">Runtime, over data</text><text x="569" y="116" class="sub" text-anchor="middle">4 surface · 0 shipped</text></g>
<line x1="400" y1="101" x2="478" y2="101" class="arr" marker-end="url(#arrow)"/>

<g class="teal"><rect x="20" y="186" width="150" height="50" rx="7"/><text x="95" y="209" class="lbl" text-anchor="middle">SDP (declarative)</text><text x="95" y="226" class="sub" text-anchor="middle">framework dry-run</text></g>
<line x1="170" y1="211" x2="314" y2="211" class="arr" marker-end="url(#arrow)"/>
<circle cx="356" cy="211" r="22" fill="#e3f2ec" stroke="#0f6e56" stroke-width="1.25"/>
<text x="356" y="219" class="big" fill="#083f33" text-anchor="middle">79</text>
<text x="356" y="244" class="sub" fill="#0f6e56" text-anchor="middle">caught before any data</text>
<g class="teal"><rect x="478" y="186" width="182" height="50" rx="7"/><text x="569" y="209" class="lbl" text-anchor="middle">Runtime, over data</text><text x="569" y="226" class="sub" text-anchor="middle">30 surface · 0 shipped</text></g>
<line x1="400" y1="211" x2="478" y2="211" class="arr" marker-end="url(#arrow)"/>

<text x="20" y="282" class="sub" fill="#5d6b66">Neither arm ships a structural defect. The dry-run is intrinsic to declarative authoring, not a harness gift.</text>
</svg>
