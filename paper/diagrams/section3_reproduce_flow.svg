<svg width="100%" viewBox="0 0 680 418" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title>Section 3: how to reproduce the five-layer isolation stack from SETUP.md</title>
<desc>Once the prerequisites are in place (EKS substrate, IRSA vending roles, per-tenant mTLS certs, the spark-connect image, warehouse external-id), four sub-deployments run inside-out, storage first and ingress last: spike/eks stands up layer 5 (storage proof 13/13 + cloudtrail_vend); authz/ stands up layer 4 (catalog proof); authz/ multi-server stands up layers 2+3 (custody proof); authz/ gateway stands up layer 1 (ingress proof). The five proof logs are the per-layer evidence; one composed request through all five links remains the frontier.</desc>
<style>
  text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .kick{font-size:11px;font-weight:700;letter-spacing:.07em;fill:#5d6b66}
  .h{font-size:12.5px;font-weight:600;fill:#26312e}.sub{font-size:11px;fill:#5d6b66}
  .col{font-size:11px;font-weight:700;letter-spacing:.05em;fill:#5d6b66}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px}
  .arr{stroke:#8a9690;stroke-width:1.4;fill:none}
  .run rect{fill:#eef3f0;stroke:#7d8a84;stroke-width:1}.run .h{fill:#3c4642}
  .lay rect{fill:#e3f2ec;stroke:#0f6e56;stroke-width:1}.lay .h{fill:#083f33}
  .prf rect{fill:#f7efdd;stroke:#8a5a0b;stroke-width:1}.prf .h{fill:#6b4606}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text x="40" y="20" class="kick">REPRODUCE THE FIVE-LAYER STACK · SETUP.md BUILD ORDER</text>
<text x="40" y="36" class="sub">built inside-out: storage first, ingress last (the reverse of the outside-in reading order)</text>

<rect x="40" y="46" width="600" height="56" rx="8" fill="none" stroke="#7d8a84" stroke-width="1" stroke-dasharray="4 4"/>
<text x="52" y="64" class="col">PREREQUISITES (ONCE)</text>
<text x="52" y="82" class="sub">EKS substrate (terraform) · IRSA vending roles · external-id · mTLS certs · connect image</text>

<text x="145" y="118" class="col" text-anchor="middle">WHAT YOU RUN</text>
<text x="362" y="118" class="col" text-anchor="middle">LAYER IT STANDS UP</text>
<text x="557" y="118" class="col" text-anchor="middle">PROOF IT WRITES</text>

<g class="run"><rect x="40" y="126" width="210" height="52" rx="7"/><text x="145" y="149" class="h" text-anchor="middle">spike/eks</text><text x="145" y="167" class="mono" text-anchor="middle">apply -k · run_spike.py</text></g>
<g class="lay"><rect x="278" y="126" width="168" height="52" rx="7"/><text x="362" y="149" class="h" text-anchor="middle" fill="#083f33">Layer 5</text><text x="362" y="167" class="sub" text-anchor="middle">storage scoping</text></g>
<g class="prf"><rect x="474" y="126" width="166" height="52" rx="7"/><text x="557" y="149" class="h" text-anchor="middle" fill="#6b4606">storage proof</text><text x="557" y="167" class="mono" text-anchor="middle">13/13 + cloudtrail_vend</text></g>
<line x1="250" y1="152" x2="278" y2="152" class="arr" marker-end="url(#arrow)"/>
<line x1="446" y1="152" x2="474" y2="152" class="arr" marker-end="url(#arrow)"/>

<g class="run"><rect x="40" y="186" width="210" height="52" rx="7"/><text x="145" y="209" class="h" text-anchor="middle">authz/ (catalog)</text><text x="145" y="227" class="mono" text-anchor="middle">IdP + OpenFGA + grants</text></g>
<g class="lay"><rect x="278" y="186" width="168" height="52" rx="7"/><text x="362" y="209" class="h" text-anchor="middle" fill="#083f33">Layer 4</text><text x="362" y="227" class="sub" text-anchor="middle">catalog authorization</text></g>
<g class="prf"><rect x="474" y="186" width="166" height="52" rx="7"/><text x="557" y="209" class="h" text-anchor="middle" fill="#6b4606">catalog proof</text><text x="557" y="227" class="mono" text-anchor="middle">perprincipal_authz.log</text></g>
<line x1="250" y1="212" x2="278" y2="212" class="arr" marker-end="url(#arrow)"/>
<line x1="446" y1="212" x2="474" y2="212" class="arr" marker-end="url(#arrow)"/>

<g class="run"><rect x="40" y="246" width="210" height="52" rx="7"/><text x="145" y="269" class="h" text-anchor="middle">authz/ (multi-server)</text><text x="145" y="287" class="mono" text-anchor="middle">gen_connect_server.py</text></g>
<g class="lay"><rect x="278" y="246" width="168" height="52" rx="7"/><text x="362" y="269" class="h" text-anchor="middle" fill="#083f33">Layers 2 + 3</text><text x="362" y="287" class="sub" text-anchor="middle">custody + execution</text></g>
<g class="prf"><rect x="474" y="246" width="166" height="52" rx="7"/><text x="557" y="269" class="h" text-anchor="middle" fill="#6b4606">custody proof</text><text x="557" y="287" class="mono" text-anchor="middle">multiserver.log</text></g>
<line x1="250" y1="272" x2="278" y2="272" class="arr" marker-end="url(#arrow)"/>
<line x1="446" y1="272" x2="474" y2="272" class="arr" marker-end="url(#arrow)"/>

<g class="run"><rect x="40" y="306" width="210" height="52" rx="7"/><text x="145" y="329" class="h" text-anchor="middle">authz/ (gateway)</text><text x="145" y="347" class="mono" text-anchor="middle">Envoy gateway-envoy.yaml</text></g>
<g class="lay"><rect x="278" y="306" width="168" height="52" rx="7"/><text x="362" y="329" class="h" text-anchor="middle" fill="#083f33">Layer 1</text><text x="362" y="347" class="sub" text-anchor="middle">mTLS ingress routing</text></g>
<g class="prf"><rect x="474" y="306" width="166" height="52" rx="7"/><text x="557" y="329" class="h" text-anchor="middle" fill="#6b4606">ingress proof</text><text x="557" y="347" class="mono" text-anchor="middle">ingress_routing.log</text></g>
<line x1="250" y1="332" x2="278" y2="332" class="arr" marker-end="url(#arrow)"/>
<line x1="446" y1="332" x2="474" y2="332" class="arr" marker-end="url(#arrow)"/>

<rect x="40" y="368" width="600" height="44" rx="8" fill="#e3f2ec" stroke="#0f6e56" stroke-width=".6"/>
<text x="52" y="387" class="h" fill="#083f33">The five proof logs are the per-layer evidence cited in §3.3.</text>
<text x="52" y="402" class="sub" fill="#0f6e56">Frontier: one composed request through all five links, not yet captured.</text>
</svg>
